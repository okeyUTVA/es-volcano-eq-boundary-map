<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Science Interactive Map: Plate Tectonics, Volcanoes & Earthquakes</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .leaflet-container {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .plate-label {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 4px;
            color: #38bdf8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 2px 6px;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            pointer-events: none;
        }
        .plate-label::before { display: none; }

        @media (max-width: 768px) {
            .drawer-panel { max-height: 50vh; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen overflow-hidden flex flex-col font-sans">

    <!-- Header Navigation Bar -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex-none z-20 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-amber-500/20 text-amber-400 rounded-lg border border-amber-500/30">
                    <i data-lucide="globe" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white leading-tight">Plate Tectonics & Volcanism Explorer</h1>
                    <p class="text-xs text-slate-400">HS Earth Science Virtual Investigation</p>
                </div>
            </div>

            <!-- Stepper Controls -->
            <div class="flex items-center bg-slate-900/80 p-1 rounded-xl border border-slate-700/80 shadow-inner">
                <button id="btn-phase-1" onclick="setPhase(1)" class="phase-btn flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-amber-400 bg-slate-800 shadow-sm border border-slate-600">
                    <span class="w-5 h-5 rounded-full bg-amber-500/20 flex items-center justify-center text-amber-400 text-[10px] font-bold">1</span>
                    <span class="hidden sm:inline">Volcanoes</span>
                </button>
                <div class="w-4 h-0.5 bg-slate-700"></div>
                <button id="btn-phase-2" onclick="setPhase(2)" class="phase-btn flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200">
                    <span class="w-5 h-5 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 text-[10px] font-bold">2</span>
                    <span class="hidden sm:inline">+ Plate Boundaries</span>
                </button>
                <div class="w-4 h-0.5 bg-slate-700"></div>
                <button id="btn-phase-3" onclick="setPhase(3)" class="phase-btn flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200">
                    <span class="w-5 h-5 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 text-[10px] font-bold">3</span>
                    <span class="hidden sm:inline">+ Earthquakes</span>
                </button>
            </div>

            <div class="flex items-center space-x-2">
                <select id="basemap-select" onchange="changeBasemap(this.value)" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-lg px-3 py-2 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-500 cursor-pointer">
                    <option value="topo" selected>Esri Topographic (Default)</option>
                    <option value="satellite">Esri Satellite Imagery</option>
                    <option value="dark">Dark Canvas (High Contrast)</option>
                    <option value="ocean">Esri Ocean Basemap</option>
                </select>

                <button onclick="toggleDrawer()" class="flex items-center space-x-1.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-2 rounded-lg text-xs transition-colors shadow-sm">
                    <i data-lucide="book-open" class="w-4 h-4"></i>
                    <span class="hidden md:inline">Investigation Guide</span>
                </button>
            </div>

        </div>
    </header>

    <!-- Main Viewport Container -->
    <div class="flex-1 relative flex overflow-hidden">

        <div id="map" class="w-full h-full z-0 bg-slate-950"></div>

        <!-- Layer Control Overlay -->
        <div class="absolute top-4 left-4 z-10 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-xl p-3 shadow-xl max-w-xs">
            <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2 flex items-center justify-between">
                <span>Active Layers</span>
                <span id="current-phase-badge" class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/30">Phase 1</span>
            </h2>
            
            <div class="space-y-2 text-xs">
                <label class="flex items-center justify-between cursor-pointer group p-1 hover:bg-slate-800/50 rounded">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-red-500 border border-amber-300 inline-block shadow-sm"></span>
                        <span class="text-slate-200 font-medium">Volcanoes (Active/Holocene)</span>
                    </div>
                    <input type="checkbox" id="layer-volcanoes" checked onchange="toggleLayer('volcanoes')" class="rounded border-slate-600 bg-slate-800 text-amber-500 focus:ring-amber-500">
                </label>

                <label class="flex items-center justify-between cursor-pointer group p-1 hover:bg-slate-800/50 rounded">
                    <div class="flex items-center space-x-2">
                        <span class="w-3.5 h-1 bg-cyan-400 inline-block rounded-full shadow-sm"></span>
                        <span class="text-slate-200 font-medium">Plate Boundaries & Labels</span>
                    </div>
                    <input type="checkbox" id="layer-plates" onchange="toggleLayer('plates')" class="rounded border-slate-600 bg-slate-800 text-amber-500 focus:ring-amber-500">
                </label>

                <label class="flex items-center justify-between cursor-pointer group p-1 hover:bg-slate-800/50 rounded">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-purple-500 border border-purple-300 inline-block shadow-sm"></span>
                        <span class="text-slate-200 font-medium">Earthquakes (M4.5+ Recent)</span>
                    </div>
                    <input type="checkbox" id="layer-earthquakes" onchange="toggleLayer('earthquakes')" class="rounded border-slate-600 bg-slate-800 text-amber-500 focus:ring-amber-500">
                </label>
            </div>
            
            <div id="boundary-legend-detail" class="mt-3 pt-2 border-t border-slate-800 hidden text-[11px] space-y-1.5 text-slate-400">
                <div class="font-semibold text-slate-300 mb-1">Boundary Types:</div>
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-1 bg-red-500 rounded"></span>
                    <span>Convergent Zone</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-1 bg-cyan-400 rounded"></span>
                    <span>Divergent Ridge</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-1 bg-yellow-400 rounded"></span>
                    <span>Transform Fault</span>
                </div>
            </div>
        </div>

        <!-- Guided Inquiry Panel -->
        <div id="inquiry-drawer" class="drawer-panel absolute right-0 top-0 bottom-0 w-full sm:w-96 bg-slate-900/95 backdrop-blur-md border-l border-slate-700/80 z-20 transition-transform duration-300 transform translate-x-0 flex flex-col shadow-2xl">
            
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-800/50">
                <div class="flex items-center space-x-2">
                    <i data-lucide="compass" class="w-5 h-5 text-amber-400"></i>
                    <h2 class="font-bold text-slate-200 text-sm">Student Guided Inquiry</h2>
                </div>
                <button onclick="toggleDrawer()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-700/50">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-5 overflow-y-auto flex-1 space-y-6 text-sm text-slate-300">
                <div id="inquiry-card" class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4 space-y-3"></div>

                <div class="space-y-2">
                    <label for="student-notes" class="font-semibold text-slate-200 flex items-center space-x-1.5 text-xs">
                        <i data-lucide="file-edit" class="w-4 h-4 text-amber-400"></i>
                        <span>Investigation Log & Observations:</span>
                    </label>
                    <textarea id="student-notes" rows="6" placeholder="Type your observations and answers here..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 resize-none leading-relaxed"></textarea>
                    <div class="flex items-center justify-between text-[11px] text-slate-500 pt-1">
                        <span id="save-status">Auto-saved to session</span>
                        <button onclick="clearNotes()" class="text-slate-400 hover:text-amber-400 underline">Clear notes</button>
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-slate-800 bg-slate-900/80 flex items-center justify-between">
                <button id="prev-phase-btn" onclick="stepPhase(-1)" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold disabled:opacity-40 flex items-center space-x-1">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    <span>Previous</span>
                </button>
                <span id="drawer-phase-step" class="text-xs font-bold text-amber-400">Phase 1 of 3</span>
                <button id="next-phase-btn" onclick="stepPhase(1)" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-lg text-xs font-bold flex items-center space-x-1">
                    <span>Next Phase</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                </button>
            </div>

        </div>

    </div>

    <script>
        let map;
        let currentPhase = 1;
        let layers = { volcanoes: null, plates: null, earthquakes: null };
        let tileLayers = {};

        // INLINE COMPLETE GEOJSON FEATURECOLLECTION (No network request, 100% reliable)
        const ACCURATE_BOUNDARIES_GEOJSON = {
            "type": "FeatureCollection",
            "features": [
                // PACIFIC RING OF FIRE - SUBDUCTION / CONVERGENT ZONES
                { "type": "Feature", "properties": { "name": "Aleutian Trench", "type": "Convergent" }, "geometry": { "type": "LineString", "coordinates": [[-162.0, 54.0], [-170.0, 52.5], [-178.0, 51.5], [175.0, 51.0], [165.0, 53.0]] } },
                { "type": "Feature", "properties": { "name": "Kuril-Kamchatka Trench", "type": "Convergent" }, "geometry": { "type": "LineString", "coordinates": [[163.0, 56.0], [158.0, 51.0], [150.0, 45.0], [144.0, 40.0]] } },
                { "type": "Feature", "properties": { "name": "Japan & Izu-Mariana Trench", "type": "Convergent" }, "geometry": { "type": "LineString", "coordinates": [[144.0, 40.0], [142.0, 36.0], [140.0, 34.0], [143.0, 28.0], [145.0, 20.0], [147.0, 15.0], [143.0, 11.0]] } },
                { "type": "Feature", "properties": { "name": "Philippine Trench", "type": "Convergent" }, "geometry": { "type": "LineString", "coordinates": [[123.0, 18.0], [125.5, 13.0], [126.5, 8.0], [127.0, 5.0]] } },
                { "type": "Feature", "properties": { "name": "Sunda (Java) Trench", "type": "Convergent" }, "geometry": { "type": "LineString", "coordinates": [[93.0, 10.0], [95.0, 5.0], [98.0, 0.0], [104.0, -6.0], [112.0, -9.0], [121.0, -10.5]] } },
                { "type": "Feature", "properties": { "name": "Tonga-Kermadec Trench", "type": "Convergent" }, "geometry": { "type": "LineString", "coordinates": [[-173.0, -15.0], [-175.0, -21.0], [-177.0, -28.0], [-178.5, -36.0]] } },
                { "type": "Feature", "properties": { "name": "Cascadia Subduction Zone", "type": "Convergent" }, "geometry": { "type": "LineString", "coordinates": [[-128.0, 50.0], [-125.0, 47.0], [-124.0, 43.0], [-124.0, 40.3]] } },
                { "type": "Feature", "properties": { "name": "Middle America Trench", "type": "Convergent" }, "geometry": { "type": "LineString", "coordinates": [[-106.0, 20.0], [-99.5, 16.5], [-93.0, 14.0], [-87.0, 11.5], [-83.0, 8.5]] } },
                { "type": "Feature", "properties": { "name": "Peru-Chile (Atacama) Trench", "type": "Convergent" }, "geometry": { "type": "LineString", "coordinates": [[-79.0, 8.5], [-79.5, 2.0], [-81.5, -5.0], [-78.5, -12.0], [-71.5, -18.0], [-71.0, -27.0], [-73.0, -35.0], [-75.5, -43.0], [-75.0, -53.0]] } },

                // DIVERGENT MID-OCEAN RIDGES
                { "type": "Feature", "properties": { "name": "Mid-Atlantic Ridge (North)", "type": "Divergent" }, "geometry": { "type": "LineString", "coordinates": [[0.0, 80.0], [-8.0, 72.0], [-18.0, 65.0], [-32.0, 52.0], [-36.0, 35.0], [-45.0, 15.0], [-25.0, 0.0]] } },
                { "type": "Feature", "properties": { "name": "Mid-Atlantic Ridge (South)", "type": "Divergent" }, "geometry": { "type": "LineString", "coordinates": [[-25.0, 0.0], [-13.0, -15.0], [-14.0, -30.0], [-10.0, -48.0], [-2.0, -54.0]] } },
                { "type": "Feature", "properties": { "name": "East Pacific Rise", "type": "Divergent" }, "geometry": { "type": "LineString", "coordinates": [[-108.5, 23.0], [-104.0, 10.0], [-110.0, -10.0], [-113.0, -25.0], [-112.0, -45.0], [-130.0, -55.0]] } },
                { "type": "Feature", "properties": { "name": "Central & Southeast Indian Ridge", "type": "Divergent" }, "geometry": { "type": "LineString", "coordinates": [[43.5, 11.5], [60.0, 5.0], [67.0, -10.0], [70.0, -25.0], [85.0, -38.0], [115.0, -48.0], [140.0, -52.0]] } },
                { "type": "Feature", "properties": { "name": "East African Rift System", "type": "Divergent" }, "geometry": { "type": "LineString", "coordinates": [[42.5, 11.5], [38.5, 7.0], [36.0, 0.0], [34.0, -8.0], [35.0, -15.0]] } },

                // TRANSFORM FAULTS
                { "type": "Feature", "properties": { "name": "San Andreas Fault System", "type": "Transform" }, "geometry": { "type": "LineString", "coordinates": [[-124.4, 40.3], [-122.8, 38.0], [-119.5, 35.3], [-116.6, 33.5], [-114.8, 31.8]] } },
                { "type": "Feature", "properties": { "name": "Alpine Fault (New Zealand)", "type": "Transform" }, "geometry": { "type": "LineString", "coordinates": [[172.0, -41.0], [170.0, -43.5], [166.5, -46.0]] } },
                
                // CONTINENTAL COLLISION ZONES
                { "type": "Feature", "properties": { "name": "Himalayan Frontal Thrust", "type": "Convergent" }, "geometry": { "type": "LineString", "coordinates": [[74.0, 34.0], [80.0, 30.0], [86.0, 27.5], [92.0, 27.0], [95.0, 24.0]] } }
            ]
        };

        const phaseGuides = {
            1: {
                title: "Phase 1: Geographic Distribution of Volcanoes",
                badge: "Phase 1: Observation",
                subtitle: "Observe global patterns without boundaries or other data.",
                prompts: [
                    "Examine the red volcanic markers across the globe. Are volcanoes distributed randomly, or do they form distinct belts?",
                    "Identify the massive ring-shaped arrangement surrounding the Pacific Ocean. What is this famous geological feature called?",
                    "Look for isolated clusters of volcanoes in the middle of oceans (e.g., Hawaii). How might these differ from coastal lines?"
                ],
                recommendedLayers: { volcanoes: true, plates: false, earthquakes: false }
            },
            2: {
                title: "Phase 2: Overlapping Plate Tectonic Boundaries",
                badge: "Phase 2: Plate Alignment",
                subtitle: "Analyze how tectonic boundaries correspond with volcanic activity.",
                prompts: [
                    "Observe where the boundary lines fall relative to the red volcano icons.",
                    "Which plate boundary zones (Red = Convergent, Cyan = Divergent, Yellow = Transform) have the highest concentration of volcanoes?",
                    "Compare the Mid-Atlantic Ridge with the western coast of South America. What differences do you notice in volcanic density?"
                ],
                recommendedLayers: { volcanoes: true, plates: true, earthquakes: false }
            },
            3: {
                title: "Phase 3: Integrating Seismic Activity (Earthquakes)",
                badge: "Phase 3: Full Synthesis",
                subtitle: "Combine Earth's major dynamic systems: Volcanoes, Plates, and Seismic energy.",
                prompts: [
                    "Where do earthquake epicenters (purple rings) occur compared to tectonic boundaries and volcanoes?",
                    "Do earthquakes occur along all plate boundary types, or primarily specific ones?",
                    "Synthesis Question: How does plate tectonic theory explain why volcanoes and earthquakes occur in the exact same geographic locations?"
                ],
                recommendedLayers: { volcanoes: true, plates: true, earthquakes: true }
            }
        };

        const VOLCANOES_DATA = [
            { name: "Mount St. Helens", country: "United States", type: "Stratovolcano", elevation: 2549, lat: 46.1914, lng: -122.1956 },
            { name: "Mount Rainier", country: "United States", type: "Stratovolcano", elevation: 4392, lat: 46.8523, lng: -121.7603 },
            { name: "Popocatépetl", country: "Mexico", type: "Stratovolcano", elevation: 5426, lat: 19.0225, lng: -98.6278 },
            { name: "Fuego", country: "Guatemala", type: "Stratovolcano", elevation: 3763, lat: 14.4730, lng: -90.8800 },
            { name: "Cotopaxi", country: "Ecuador", type: "Stratovolcano", elevation: 5897, lat: -0.6770, lng: -78.4360 },
            { name: "Villarrica", country: "Chile", type: "Stratovolcano", elevation: 2847, lat: -39.4200, lng: -71.9300 },
            { name: "Fuji", country: "Japan", type: "Stratovolcano", elevation: 3776, lat: 35.3606, lng: 138.7274 },
            { name: "Mount Pinatubo", country: "Philippines", type: "Stratovolcano", elevation: 1486, lat: 15.1429, lng: 120.3500 },
            { name: "Krakatoa", country: "Indonesia", type: "Caldera", elevation: 813, lat: -6.1020, lng: 105.4230 },
            { name: "Mount Merapi", country: "Indonesia", type: "Stratovolcano", elevation: 2910, lat: -7.5400, lng: 110.4460 },
            { name: "Taupo", country: "New Zealand", type: "Supervolcano", elevation: 357, lat: -38.8060, lng: 175.9000 },
            { name: "Kilauea", country: "Hawaii", type: "Shield Volcano", elevation: 1247, lat: 19.4210, lng: -155.2870 },
            { name: "Eyjafjallajökull", country: "Iceland", type: "Stratovolcano", elevation: 1666, lat: 63.6300, lng: -19.6200 },
            { name: "Mount Etna", country: "Italy", type: "Stratovolcano", elevation: 3357, lat: 37.7510, lng: 14.9930 }
        ];

        const PLATE_LABELS = [
            { name: "Pacific Plate", lat: 0, lng: -150 },
            { name: "North American Plate", lat: 48, lng: -100 },
            { name: "South American Plate", lat: -22, lng: -58 },
            { name: "Eurasian Plate", lat: 50, lng: 70 },
            { name: "African Plate", lat: 0, lng: 20 },
            { name: "Indo-Australian Plate", lat: -22, lng: 130 },
            { name: "Antarctic Plate", lat: -78, lng: 0 },
            { name: "Nazca Plate", lat: -20, lng: -95 },
            { name: "Cocos Plate", lat: 10, lng: -98 },
            { name: "Caribbean Plate", lat: 14, lng: -73 },
            { name: "Arabian Plate", lat: 23, lng: 45 },
            { name: "Philippine Plate", lat: 16, lng: 134 }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initMap();
            loadNotes();
            setPhase(1);
        });

        function initMap() {
            map = L.map('map', { center: [20, 10], zoom: 2.5, minZoom: 2, maxZoom: 18, zoomControl: false });
            L.control.zoom({ position: 'bottomleft' }).addTo(map);

            tileLayers = {
                topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }),
                dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }),
                satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }),
                ocean: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 13 })
            };
            tileLayers.topo.addTo(map);

            layers.volcanoes = L.layerGroup();
            layers.plates = L.layerGroup();
            layers.earthquakes = L.layerGroup();

            buildVolcanoLayer();
            drawPlateBoundaries();
            fetchEarthquakeData();
        }

        function changeBasemap(key) {
            Object.keys(tileLayers).forEach(k => { if (map.hasLayer(tileLayers[k])) map.removeLayer(tileLayers[k]); });
            if (tileLayers[key]) tileLayers[key].addTo(map);
        }

        function buildVolcanoLayer() {
            VOLCANOES_DATA.forEach(volcano => {
                const marker = L.circleMarker([volcano.lat, volcano.lng], {
                    radius: 6, fillColor: '#ef4444', color: '#fef08a', weight: 1.5, opacity: 0.9, fillOpacity: 0.85
                });
                marker.bindPopup(`<b>${volcano.name}</b><br>${volcano.country} (${volcano.type})`);
                layers.volcanoes.addLayer(marker);
            });
        }

        function drawPlateBoundaries() {
            // Render GeoJSON directly inside Leaflet
            const plateGeoLayer = L.geoJSON(ACCURATE_BOUNDARIES_GEOJSON, {
                style: function(feature) {
                    const type = feature.properties.type;
                    if (type === 'Convergent') return { color: '#ef4444', weight: 3.5, opacity: 0.85 };
                    if (type === 'Divergent') return { color: '#22d3ee', weight: 3.5, opacity: 0.85 };
                    return { color: '#eab308', weight: 3, opacity: 0.85, dashArray: '5, 5' };
                },
                onEachFeature: function(feature, layer) {
                    layer.bindTooltip(`Boundary: <b>${feature.properties.name}</b> (${feature.properties.type})`, { sticky: true });
                }
            });

            layers.plates.addLayer(plateGeoLayer);

            // Add Text Labels for Plates
            PLATE_LABELS.forEach(plate => {
                const labelMarker = L.marker([plate.lat, plate.lng], {
                    icon: L.divIcon({ className: 'plate-label', html: plate.name, iconAnchor: [40, 10] })
                });
                layers.plates.addLayer(labelMarker);
            });
        }

        function fetchEarthquakeData() {
            fetch("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_month.geojson")
                .then(res => res.json())
                .then(data => {
                    data.features.forEach(eq => {
                        const [lng, lat] = eq.geometry.coordinates;
                        const marker = L.circleMarker([lat, lng], {
                            radius: Math.max(3, eq.properties.mag * 1.8),
                            fillColor: '#a855f7', color: '#e9d5ff', weight: 1, opacity: 0.8, fillOpacity: 0.6
                        });
                        marker.bindPopup(`<b>Magnitude ${eq.properties.mag}</b><br>${eq.properties.place}`);
                        layers.earthquakes.addLayer(marker);
                    });
                })
                .catch(() => {
                    console.warn("USGS feed offline, using fallback points.");
                });
        }

        function setPhase(phaseNum) {
            currentPhase = phaseNum;
            const config = phaseGuides[phaseNum];

            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`btn-phase-${i}`);
                if (i === phaseNum) {
                    btn.className = "phase-btn flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-amber-400 bg-slate-800 border border-slate-600";
                } else {
                    btn.className = "phase-btn flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400";
                }
            }

            applyLayerVisibility('volcanoes', config.recommendedLayers.volcanoes);
            applyLayerVisibility('plates', config.recommendedLayers.plates);
            applyLayerVisibility('earthquakes', config.recommendedLayers.earthquakes);

            document.getElementById('layer-volcanoes').checked = config.recommendedLayers.volcanoes;
            document.getElementById('layer-plates').checked = config.recommendedLayers.plates;
            document.getElementById('layer-earthquakes').checked = config.recommendedLayers.earthquakes;

            const legendDetail = document.getElementById('boundary-legend-detail');
            if (config.recommendedLayers.plates) {
                legendDetail.classList.remove('hidden');
            } else {
                legendDetail.classList.add('hidden');
            }

            document.getElementById('current-phase-badge').innerText = `Phase ${phaseNum}`;
            document.getElementById('drawer-phase-step').innerText = `Phase ${phaseNum} of 3`;
            document.getElementById('prev-phase-btn').disabled = (phaseNum === 1);
            document.getElementById('next-phase-btn').disabled = (phaseNum === 3);

            document.getElementById('inquiry-card').innerHTML = `
                <h3 class="font-bold text-slate-100 text-base">${config.title}</h3>
                <p class="text-xs text-slate-400 italic">${config.subtitle}</p>
                <ul class="space-y-2 text-xs text-slate-300 list-disc pl-4 pt-2">
                    ${config.prompts.map(p => `<li>${p}</li>`).join('')}
                </ul>
            `;
        }

        function applyLayerVisibility(layerKey, isVisible) {
            if (isVisible) { if (!map.hasLayer(layers[layerKey])) map.addLayer(layers[layerKey]); }
            else { if (map.hasLayer(layers[layerKey])) map.removeLayer(layers[layerKey]); }
        }

        function toggleLayer(layerKey) {
            applyLayerVisibility(layerKey, document.getElementById(`layer-${layerKey}`).checked);

            if (layerKey === 'plates') {
                const legendDetail = document.getElementById('boundary-legend-detail');
                if (document.getElementById('layer-plates').checked) {
                    legendDetail.classList.remove('hidden');
                } else {
                    legendDetail.classList.add('hidden');
                }
            }
        }

        function stepPhase(delta) {
            if (currentPhase + delta >= 1 && currentPhase + delta <= 3) setPhase(currentPhase + delta);
        }

        function toggleDrawer() {
            document.getElementById('inquiry-drawer').classList.toggle('translate-x-full');
        }

        const notesTextarea = document.getElementById('student-notes');
        notesTextarea.addEventListener('input', () => localStorage.setItem('hs_earth_sci_volcano_notes', notesTextarea.value));
        function loadNotes() { if (localStorage.getItem('hs_earth_sci_volcano_notes')) notesTextarea.value = localStorage.getItem('hs_earth_sci_volcano_notes'); }
        function clearNotes() { notesTextarea.value = ''; localStorage.removeItem('hs_earth_sci_volcano_notes'); }
    </script>
</body>
</html>
